<script>
const dock=document.querySelector('#dock'),route=document.querySelector('#route'),statusText=document.querySelector('#status'),source=document.querySelector('#source'),sink=document.querySelector('#sink');
function show(step,port=2){dock.replaceChildren();source.classList.toggle('target',step===0);sink.classList.toggle('target',step===2);route.setAttribute('visibility',step>=3?'visible':'hidden');route.classList.toggle('draft',step===3);route.setAttribute('d','M'+(22+(port-2)*2)+' 32 V66 H78');
function label(t){let e=document.createElement('span');e.textContent=t;dock.append(e)}
function action(t,f,primary=false){let b=document.createElement('button');b.textContent=t;b.className=primary?'action':'';b.onclick=f;dock.append(b)}
source.onclick=()=>{if(step===0)show(1)};sink.onclick=()=>{if(step===2)show(3,port)};
statusText.textContent=['Select the source machine to see its outputs.','Choose an outlet from the enlarged strip. Its position matches the machine edge.','The source stays selected after you lift. Tap the destination to preview the belt.','Check the highlighted path. Back lets you choose a different destination.','Belt placed. One undo removes this connection.'][step];
if(step===0)label('Select a machine');
if(step===1){label('Connect output');[1,2,3].forEach(n=>action(String(n),()=>show(2,n)))}
if(step===2||step===3)label('Output '+port+' → '+(step===2?'…':'Destination'));
if(step===3){action('Back',()=>show(2,port));action('Lay belt',()=>show(4,port),true)}
if(step>0&&step<4)action('Cancel',()=>show(0));
if(step===4){label('Connected');action('Undo',()=>show(0))}
}show(0);
</script></html>
