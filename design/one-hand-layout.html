<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndustrialPlanner one-handed layout study</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--foreground, #203542); font: 16px/1.45 "Bahnschrift", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 850px; margin: auto; }
  h1 { margin: 0 0 5px; font-size: clamp(1.38rem, 5vw, 2.1rem); line-height: 1.12; letter-spacing: -.035em; }
  p { margin: 0; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, canvas:focus-visible { outline: 3px solid var(--ring, #ca8a04); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: .5; }
  .intro { margin-bottom: 14px; }
  .switches, .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .switches { margin-bottom: 8px; justify-content: space-between; }
  .switches button { min-height: 44px; padding: 4px 10px; border: 1px solid var(--border, #9cb3c2); border-radius: 5px; background: var(--secondary, #e9f0f3); color: var(--foreground, #203542); }
  .switches button[aria-pressed="true"] { background: var(--primary, #274a60); color: var(--primary-foreground, #fff); font-weight: 700; }
  .bench { --paper: #142b37; --line: #365361; --ink: #e4f2f6; --dim: #adcad5; --gold: #f4cb74; --mint: #79e0cf; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .brief { padding: 10px 13px; min-height: 66px; border-bottom: 1px solid var(--line); }
  #status { color: var(--dim); font-size: .9rem; }
  .drawing { position: relative; height: clamp(235px, 51vw, 350px); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .local { position: absolute; display: flex; flex-wrap: wrap; gap: 5px; width: max-content; max-width: calc(100% - 16px); }
  .local:empty { display: none; }
  .local button { min-height: 44px; min-width: 44px; padding: 4px 9px; border: 1px solid #8db0bd; border-radius: 5px; background: #203e4d; color: var(--ink); box-shadow: 0 2px 7px #142b37; }
  .local button.primary { background: var(--gold); color: #213340; }
  .comparison { margin: 14px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .comparison div { border-block-start: 2px solid var(--border, #8aabbc); padding: 7px 0 4px; }
  .comparison div + div { border-color: var(--primary, #2a7393); }
  .comparison dt { font-weight: 720; margin-bottom: 4px; }
  .comparison dd { margin: 0; font-size: .93rem; }
  .tradeoff { margin-top: 6px; font-size: .92rem; }
  @media (max-width: 420px) {
    .switches { justify-content: flex-start; }
    .comparison { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header class="intro">
    <h1>One-handed layout study</h1>
    <p>Work directly on the grid. The preview shows what will happen when you lift.</p>
  </header>
  <div class="switches">
    <div class="actions" aria-label="Layout task" role="group">
      <button data-task="place" aria-pressed="false">Place</button>
      <button data-task="route" aria-pressed="true">Connect</button>
      <button data-task="repeat" aria-pressed="false">Repeat a lane</button>
    </div>
    <div class="actions">
      <button id="hand" type="button" aria-label="Change handedness">Right hand</button>
      <button id="reset" type="button">Reset task</button>
    </div>
  </div>
  <section class="bench" data-hand="right" aria-label="Interactive layout mockup">
    <div class="brief"><strong id="task"></strong><p id="status" aria-live="polite"></p></div>
    <div class="drawing">
      <canvas tabindex="0" aria-label="Layout grid. Use arrow keys to aim and Enter or Space to act. Use Control+Z or Command+Z to undo." aria-describedby="status"></canvas>
      <div class="local" id="context" role="group" aria-label="Nearby actions"></div>
    </div>
  </section>
  <dl class="comparison">
    <div><dt>Current planner</dt><dd id="current"></dd></div>
    <div><dt>Proposed workflow</dt><dd id="proposal"></dd></div>
  </dl>
  <p class="tradeoff" id="tradeoff"></p>
</main>
<script>
const tasks = {
  place: {
    title: "Place a Refining Unit at the belt end",
    current: "Pick from the hotbar, palette, or marking menu. Finger input moves a preview, then commits via the preview or a floating button. Precise pen taps place directly and keep the machine in hand.",
    proposal: "With the Refining Unit in hand, aim near the belt end. The preview snaps to the free connection and rotates. Lift to place the machine.",
    tradeoff: "A strong snap aligns the machine and its input. Away from the belt, the machine follows the grid. Undo appears near the edit."
  },
  route: {
    title: "Connect the Refining Unit to either Fitting Unit",
    current: "Start at an outlet and drag to the destination. The route can snap into a free input around obstacles. Lifting commits the belt.",
    proposal: "Start anywhere on the source body and draw toward a destination. A nearby free port lights up. Lift on a clear target to lay the belt.",
    tradeoff: "Still one stroke. If you lift in the marked junction between destinations, the route stays open and shows both choices beside your pen."
  },
  repeat: {
    title: "Fill the two remaining lanes in the plan",
    current: "Select the lane and copy it into a temporary blueprint. Position and place the preview for each copy, aligning the spacing on the grid.",
    proposal: "Pull down from either machine in the lane. The span sets the spacing, and the pinned plan supplies the count. Lift to place the ghost copies.",
    tradeoff: "The sample plan calls for two more lanes. The preview includes their internal belts, and a nearby Undo removes the batch."
  }
};
const scenarios = {
  place: { machines: [{ x: 8, y: 5, w: 3, h: 2, kind: "Fitting Unit" }] },
  route: {
    machines: [
      { x: 1, y: 3, w: 2, h: 3, kind: "Refining Unit" },
      { x: 10, y: 1, w: 3, h: 2, kind: "Fitting Unit" },
      { x: 10, y: 7, w: 3, h: 2, kind: "Fitting Unit" }
    ],
    obstacle: { x: 6, y: 4, w: 2, h: 2 }
  },
  repeat: {
    machines: [
      { x: 1, y: 1, w: 3, h: 2, kind: "Refining Unit" },
      { x: 7, y: 1, w: 3, h: 2, kind: "Fitting Unit" }
    ]
  }
};

const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
const bench = document.querySelector(".bench");
const get = (id) => document.getElementById(id);
const columns = 14;
const rows = 10;
const palette = { paper: "#142b37", line: "#365361", major: "#4a6470", dim: "#adcad5", ink: "#e4f2f6", machine: "#315569", gold: "#f4cb74", mint: "#79e0cf", error: "#ff9886" };
let task = "route";
let state;
let gesture = null;
let keyboard = null;
let frame;
let anchor = null;

function reset() {
  state = { draft: null, selected: false, port: null, target: null, ambiguous: false, pitch: null, copies: 2, history: [], notice: "" };
  anchor = null;
  gesture = null;
  keyboard = null;
  get("task").textContent = tasks[task].title;
  for (const key of ["current", "proposal", "tradeoff"]) get(key).textContent = tasks[task][key];
  render();
}

function addButton(label, action, primary = false) {
  const button = document.createElement("button");
  button.textContent = label;
  button.classList.toggle("primary", primary);
  button.onclick = () => {
    action();
    render();
  };
  get("context").append(button);
}

function clearDraft() {
  Object.assign(state, { draft: null, selected: false, port: null, target: null, ambiguous: false, pitch: null });
}

function addEdit(edit) {
  state.history.push(edit);
  state.notice = edit.notice;
  clearDraft();
}

function place() {
  if (!validPlacement()) {
    state.notice = "That footprint is blocked.";
    clearDraft();
    return;
  }
  addEdit({ machines: [state.draft], notice: "Refining Unit placed." });
}

function layBelt(target) {
  state.target = target;
  state.port = target === 1 ? 0 : 2;
  addEdit({ path: routePath(), notice: "Belt laid." });
}

function repeatLane() {
  if (!validRepeat()) {
    state.notice = "That spacing will not fit two more lanes.";
    clearDraft();
    return;
  }
  const offsets = repeatOffsets();
  addEdit({
    lanes: offsets,
    machines: offsets.flatMap((y) => scenarios.repeat.machines.map((machine) => ({ ...machine, y: machine.y + y }))),
    notice: "Two lanes placed."
  });
}

function undo() {
  if (!state.history.length) return;
  state.history.pop();
  clearDraft();
  state.notice = "Last edit undone.";
  anchor = null;
}

function aimMachine(x, y) {
  const snapped = Math.abs(x - 5.6) <= 1.3 && Math.abs(y - 4.5) <= 1.3;
  state.draft = {
    x: snapped ? 5 : Math.floor(x) - 1,
    y: snapped ? 3 : Math.floor(y),
    w: snapped ? 2 : 3,
    h: snapped ? 3 : 2,
    kind: "Refining Unit",
    rotated: snapped
  };
}

function validPlacement() {
  const draft = state.draft;
  return draft !== null && draft.x >= 0 && draft.y >= 0
    && draft.x + draft.w <= columns && draft.y + draft.h <= rows
    && !(draft.x < 5 && draft.x + draft.w > 1 && draft.y <= 4.5 && draft.y + draft.h > 4.5)
    && allMachines().every((machine) => draft.x + draft.w <= machine.x || machine.x + machine.w <= draft.x
      || draft.y + draft.h <= machine.y || machine.y + machine.h <= draft.y);
}

function repeatOffsets() {
  return Array.from({ length: state.copies }, (_, i) => (i + 1) * state.pitch);
}

function validRepeat() {
  const used = state.history.flatMap((edit) => edit.lanes ?? []);
  return state.pitch >= 2 && 3 + state.pitch * state.copies <= rows
    && repeatOffsets().every((offset) => used.every((previous) => Math.abs(offset - previous) >= 2));
}

function routePath(target = state.target) {
  const start = target === 1 ? 3.5 : 5.5;
  const end = scenarios.route.machines[target].y + 1;
  return [[3, start], [4.5, start], [4.5, end], [10, end]];
}

function allMachines() {
  return [...scenarios[task].machines, ...state.history.flatMap((edit) => edit.machines ?? [])];
}

function message() {
  if (state.notice) return state.notice;
  if (task === "place") {
    if (!state.draft) return "Refining Unit in hand. Aim near the open belt end, or place anywhere free.";
    if (!validPlacement()) return "The footprint is blocked. Slide to another spot.";
    return state.draft.rotated ? "Snapped to the belt. Lift to place." : "Lift to place.";
  }
  if (task === "route") {
    if (state.history.length) return "Belt laid.";
    if (!state.selected) return "Drag from the Refining Unit toward either Fitting Unit.";
    if (state.ambiguous) return "Both destinations are plausible. Pick one or keep drawing.";
    if (state.target !== null) return "Outlet " + (state.port + 1) + " to the highlighted input. Lift to lay the belt.";
    return "Keep drawing toward a Fitting Unit. You can lift and tap a destination.";
  }
  if (!state.selected) return "Drag down from either machine. Try a gap of three grid cells.";
  if (state.pitch === null) return "Pull below the source lane to set the spacing.";
  return validRepeat() ? "Spacing: " + state.pitch + " cells. Lift to place both lanes."
    : "The copies overlap or fall outside the grid. Adjust the spacing.";
}

function render() {
  const status = message();
  if (get("status").textContent !== status) get("status").textContent = status;
  draw();
  renderNearbyActions();
}

function renderNearbyActions() {
  const menu = get("context");
  if (gesture || !anchor || !(state.history.length || state.ambiguous)) {
    menu.replaceChildren();
    return;
  }
  const labels = state.ambiguous ? ["Upper unit", "Lower unit", "Cancel"] : ["Undo"];
  if (menu.textContent !== labels.join("")) {
    menu.replaceChildren();
    if (state.ambiguous) {
      addButton("Upper unit", () => layBelt(1), true);
      addButton("Lower unit", () => layBelt(2), true);
      addButton("Cancel", clearDraft);
    } else {
      addButton("Undo", undo);
    }
  }
  const { width, height } = canvas.getBoundingClientRect();
  const left = bench.dataset.hand === "right" ? anchor.x - menu.offsetWidth - 12 : anchor.x + 12;
  menu.style.left = Math.max(8, Math.min(width - menu.offsetWidth - 8, left)) + "px";
  const above = anchor.y - menu.offsetHeight - 12;
  menu.style.top = (above >= 8 ? Math.min(above, height - menu.offsetHeight - 8) : anchor.y + 12) + "px";
}

function draw() {
  const { width, height } = canvas.getBoundingClientRect();
  if (!width || !height) return;
  const density = window.devicePixelRatio || 1;
  const bufferWidth = Math.round(width * density);
  const bufferHeight = Math.round(height * density);
  if (canvas.width !== bufferWidth) canvas.width = bufferWidth;
  if (canvas.height !== bufferHeight) canvas.height = bufferHeight;
  ctx.setTransform(density, 0, 0, density, 0, 0);
  ctx.fillStyle = palette.paper;
  ctx.fillRect(0, 0, width, height);
  const size = Math.min((width - 22) / columns, (height - 18) / rows);
  frame = { size, x: (width - columns * size) / 2, y: (height - rows * size) / 2 };
  ctx.translate(frame.x, frame.y);
  ctx.scale(size, size);
  ctx.fillStyle = "#1a3341";
  ctx.fillRect(0, 0, columns, rows);
  for (let x = 0; x <= columns; x += 1) drawLine([[x, 0], [x, rows]], x % 5 === 0 ? palette.major : palette.line, 1);
  for (let y = 0; y <= rows; y += 1) drawLine([[0, y], [columns, y]], y % 5 === 0 ? palette.major : palette.line, 1);

  if (task === "place") {
    drawLine([[1, 4.5], [5, 4.5]], palette.mint, 5);
    drawDot(4.95, 4.5, palette.mint, 4);
  }

  if (task === "repeat") {
    for (const offset of [0, ...state.history.flatMap((edit) => edit.lanes)]) {
      drawLine([[4, 2 + offset], [7, 2 + offset]], palette.mint, 5);
    }
    if (state.selected && state.pitch > 0) {
      const paint = validRepeat() ? palette.gold : palette.error;
      drawLine([[.6, 1], [.6, 1 + state.pitch]], paint, 2, true);
      for (const offset of repeatOffsets()) {
        drawLine([[4, 2 + offset], [7, 2 + offset]], paint, 4, true);
        for (const machine of scenarios.repeat.machines) drawMachine({ ...machine, y: machine.y + offset }, paint, true);
      }
    }
  }

  if (task === "route") {
    const block = scenarios.route.obstacle;
    ctx.fillStyle = "#22343c";
    ctx.fillRect(block.x, block.y, block.w, block.h);
    for (let i = 0; i < 4; i += 1) drawLine([[6 + i / 2, 4], [6 + i / 2, 6]], palette.line, 3);
    for (const edit of state.history) drawLine(edit.path, palette.mint, 5);
    if (state.target !== null) drawLine(routePath(), palette.gold, 4, true);
    if (state.ambiguous) for (const target of [1, 2]) drawLine(routePath(target), palette.gold, 3, true);
    if (!state.history.length) {
      ctx.strokeStyle = palette.line;
      ctx.lineWidth = 1 / size;
      ctx.setLineDash([4 / size, 3 / size]);
      ctx.strokeRect(9.5, 4.35, 3.65, 1.3);
      ctx.setLineDash([]);
      ctx.fillStyle = palette.dim;
      ctx.font = Math.min(12, size * .52) / size + "px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Both paths", 11.3, 5, 3.4);
    }
  }

  allMachines().forEach((machine, index) => {
    const marked = state.selected && (task === "repeat" ? index < 2 : index === 0 || index === state.target);
    drawMachine(machine, marked ? palette.gold : palette.dim);
  });
  if (task === "route") {
    for (const port of [0, 1, 2]) {
      drawDot(3.03, 3.5 + port, state.port === port ? palette.gold : palette.dim, state.selected ? 5 : 3);
      if (state.selected) {
        ctx.fillStyle = state.port === port ? palette.gold : palette.ink;
        ctx.font = 12 / size + "px system-ui";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(String(port + 1), 3.38, 3.5 + port);
      }
    }
    for (const target of scenarios.route.machines.slice(1)) drawDot(9.97, target.y + 1, palette.mint, 4);
  }
  if (state.draft) drawMachine(state.draft, validPlacement() ? palette.gold : palette.error, true);
  if (keyboard) {
    ctx.strokeStyle = palette.mint;
    ctx.lineWidth = 2 / size;
    ctx.strokeRect(keyboard.x + .06, keyboard.y + .06, .88, .88);
  }
}

function drawLine(points, color, width, dashed = false) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.strokeStyle = color;
  ctx.lineWidth = width / frame.size;
  if (dashed) ctx.setLineDash([6 / frame.size, 4 / frame.size]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawDot(x, y, color, radius) {
  ctx.beginPath();
  ctx.arc(x, y, radius / frame.size, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawMachine(machine, edge, ghost = false) {
  const { x, y, w, h, kind } = machine;
  ctx.fillStyle = ghost ? "#3c4037" : palette.machine;
  ctx.fillRect(x + .06, y + .06, w - .12, h - .12);
  ctx.strokeStyle = edge;
  ctx.lineWidth = (ghost ? 2 : 1) / frame.size;
  if (ghost) ctx.setLineDash([5 / frame.size, 3 / frame.size]);
  ctx.strokeRect(x + .06, y + .06, w - .12, h - .12);
  ctx.setLineDash([]);
  const [name, suffix] = kind.split(" ");
  const unit = 1 / frame.size;
  const labelSize = Math.min(14, frame.size * .51);
  ctx.fillStyle = ghost ? edge : palette.ink;
  ctx.font = "bold " + labelSize * unit + "px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(name, x + w / 2, y + h / 2 - .26, w - .2);
  ctx.font = labelSize * .86 * unit + "px system-ui";
  ctx.fillText(suffix, x + w / 2, y + h / 2 + .31, w - .2);
  if (machine.rotated) drawDot(x + .25, y + .25, edge, 2.5);
}

function gridPoint(event) {
  const bounds = canvas.getBoundingClientRect();
  const x = event.clientX - bounds.left;
  const y = event.clientY - bounds.top;
  return { x: (x - frame.x) / frame.size, y: (y - frame.y) / frame.size, anchor: { x, y } };
}

function begin(point) {
  if (point.x < 0 || point.y < 0 || point.x >= columns || point.y >= rows) return;
  state.notice = "";
  if (task === "place") return aimMachine(point.x, point.y);
  if (task === "route" && state.history.length) return;
  const machines = scenarios[task].machines;
  const sources = task === "route" ? machines.slice(0, 1) : machines;
  if (sources.some((m) => point.x >= m.x && point.x < m.x + m.w && point.y >= m.y && point.y < m.y + m.h)) {
    state.selected = true;
  }
}

function aim(point) {
  if (task === "place" && state.draft) {
    aimMachine(point.x, point.y);
  } else if (state.selected && task === "route") {
    state.ambiguous = point.x >= 9.5 && point.x <= 13.15 && Math.abs(point.y - 5) <= .65;
    state.target = point.x < 9.45 || point.x > 13.55 ? null
      : point.y >= .5 && point.y <= 3.5 ? 1
      : point.y >= 6.5 && point.y <= 9.5 ? 2 : null;
    state.port = state.target === 1 ? 0 : state.target === 2 ? 2 : null;
  } else if (state.selected && task === "repeat") {
    state.pitch = Math.max(0, Math.floor(point.y) - 1);
  }
}

function finish() {
  if (task === "place" && state.draft) place();
  if (task === "route" && state.target !== null) layBelt(state.target);
  if (task === "repeat" && state.pitch > 0) repeatLane();
}

canvas.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || gesture !== null || !frame) return;
  const point = gridPoint(event);
  keyboard = null;
  gesture = event.pointerId;
  canvas.setPointerCapture(event.pointerId);
  begin(point);
  if (state.selected) aim(point);
  render();
});
canvas.addEventListener("pointermove", (event) => {
  if (gesture !== event.pointerId) return;
  aim(gridPoint(event));
  render();
});
canvas.addEventListener("pointerup", (event) => {
  if (gesture !== event.pointerId) return;
  const point = gridPoint(event);
  gesture = null;
  anchor = point.anchor;
  if (state.draft || state.selected) aim(point);
  finish();
  render();
});
for (const name of ["pointercancel", "lostpointercapture"]) {
  canvas.addEventListener(name, (event) => {
    if (gesture !== event.pointerId) return;
    gesture = null;
    clearDraft();
    render();
  });
}

canvas.addEventListener("keydown", (event) => {
  const delta = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[event.key];
  keyboard ??= { x: 0, y: 0 };
  if (delta) {
    event.preventDefault();
    keyboard.x = Math.max(0, Math.min(columns - 1, keyboard.x + delta[0]));
    keyboard.y = Math.max(0, Math.min(rows - 1, keyboard.y + delta[1]));
    if (state.selected) aim({ x: keyboard.x + .5, y: keyboard.y + .5 });
    render();
  } else if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    const point = { x: keyboard.x + .5, y: keyboard.y + .5 };
    anchor = { x: frame.x + point.x * frame.size, y: frame.y + point.y * frame.size };
    begin(point);
    aim(point);
    finish();
    render();
  }
});
document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z" && state.history.length) {
    event.preventDefault();
    undo();
    render();
  }
  if (event.key === "Escape") {
    clearDraft();
    render();
  }
});
for (const button of document.querySelectorAll("[data-task]")) {
  button.onclick = () => {
    task = button.dataset.task;
    for (const peer of document.querySelectorAll("[data-task]")) peer.setAttribute("aria-pressed", String(peer === button));
    reset();
  };
}
get("hand").onclick = () => {
  bench.dataset.hand = bench.dataset.hand === "right" ? "left" : "right";
  get("hand").textContent = bench.dataset.hand === "right" ? "Right hand" : "Left hand";
  renderNearbyActions();
};
get("reset").onclick = reset;
new ResizeObserver(() => {
  draw();
  renderNearbyActions();
}).observe(canvas);
reset();
</script>
</body>
</html>
